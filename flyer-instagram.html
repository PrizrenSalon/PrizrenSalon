<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Prizren Literary Salon — Instagram Flyer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #2e1f0f;
    }

    .flyer {
      width: 1080px;
      height: 1080px;
      background: #2e1f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 80px 90px;
    }

    /* Decorative border */
    .flyer::before {
      content: '';
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(200, 146, 42, 0.35);
      pointer-events: none;
    }
    .flyer::after {
      content: '';
      position: absolute;
      inset: 36px;
      border: 1px solid rgba(200, 146, 42, 0.15);
      pointer-events: none;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #c8922a;
      border-style: solid;
      opacity: 0.6;
    }
    .corner-tl { top: 48px; left: 48px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 48px; right: 48px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 48px; left: 48px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 48px; right: 48px; border-width: 0 1px 1px 0; }

    .inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .ornament {
      font-size: 0.9rem;
      letter-spacing: 0.5em;
      color: #c8922a;
      margin-bottom: 1.8rem;
    }

    .salon-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.8rem;
      font-weight: 300;
      line-height: 1;
      color: #f5ede0;
      margin-bottom: 0.5rem;
    }

    .salon-name em {
      font-style: italic;
      color: #c8922a;
    }

    .salon-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      letter-spacing: 0.38em;
      color: rgba(200, 146, 42, 0.75);
      text-transform: uppercase;
      margin-bottom: 2.6rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.6rem;
      width: 100%;
      justify-content: center;
    }

    .divider-line {
      flex: 1;
      max-width: 160px;
      height: 1px;
      background: rgba(200, 146, 42, 0.35);
    }

    .divider-gem {
      color: #c8922a;
      font-size: 0.75rem;
    }

    .date-venue {
      margin-bottom: 2.8rem;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-style: italic;
      color: #f5ede0;
      margin-bottom: 0.5rem;
    }

    .venue {
      font-family: 'EB Garamond', serif;
      font-size: 1.05rem;
      color: rgba(245, 237, 224, 0.6);
      letter-spacing: 0.06em;
    }

    .readers-label {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      color: #c8922a;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
    }

    .readers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.55rem 2.5rem;
      margin-bottom: 2.8rem;
      width: 100%;
      justify-items: center;
    }

    .reader {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      color: #f5ede0;
      font-weight: 400;
      white-space: nowrap;
    }

    .public-tag {
      display: inline-block;
      border: 1px solid rgba(200, 146, 42, 0.45);
      padding: 0.45rem 1.4rem;
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      color: #c8922a;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .web {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: rgba(200, 146, 42, 0.5);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="inner">
      <p class="ornament">❖ &nbsp; ❖ &nbsp; ❖</p>

      <h1 class="salon-name">Prizren <em>Literary</em> Salon</h1>
      <p class="salon-sub">Prizren · Kosovo</p>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-gem">❖</span>
        <div class="divider-line"></div>
      </div>

      <div class="date-venue">
        <p class="date">Saturday, August 8, 2026 · 18:00</p>
        <p class="venue">BarAca · Old Town Prizren</p>
      </div>

      <p class="readers-label">2026 Readers</p>

      <div class="readers-grid">
        <span class="reader">Panagiotis Kehagias</span>
        <span class="reader">Benjamin Libman</span>
        <span class="reader">Lauren Oyler</span>
        <span class="reader">Tobias Ryan</span>
        <span class="reader">Ena Selimović</span>
        <span class="reader">Kat Tang</span>
      </div>

      <div class="public-tag">Open to the Public · Free</div>
      <p class="web">www.prizrensalon.org</p>
    </div>
  </div>
</body>
</html>
